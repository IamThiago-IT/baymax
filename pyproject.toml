[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baymax"
version = "0.1.0"
description = "Health-focused virtual assistant CLI"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
baymax = "baymax.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
